project:
  type: website
  output-dir: _site
  render:
    - notes.qmd
    - posts/**/*.qmd
  resources:
    - index.html
    - research.html
    - projects.html
    - publications.html
    - talks.html
    - cv.html
    - styles.css
    - site.js
    - MyCV.pdf
    - assets/**
    - 404.html
    - robots.txt

website:
  title: "Mohammad Ful Hossain Seikh"
  site-url: "https://mohammad-neutrino.github.io/"
  description: "Official academic website of Mohammad Ful Hossain Seikh, Postdoctoral Researcher in Particle Astrophysics at the University of Kansas."
  open-graph: true

format:
  html:
    theme: cosmo
    css: styles.css
    page-layout: full
    toc: false
    include-before-body: includes/quarto-header.html
    include-after-body: includes/quarto-footer.html
